name: Auto Rerun Failed Signal Logger

# Re-runs the Signal Logger workflow once if it fails, to recover from
# transient hosted-runner acquisition errors and similar GitHub infra hiccups.
# Only re-runs the failed jobs, and only on the first attempt — so a genuine
# code failure won't loop forever.

on:
  workflow_run:
    workflows: ["Signal Logger"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Re-running failed jobs for run $RUN_ID (attempt ${{ github.event.workflow_run.run_attempt }})."
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
