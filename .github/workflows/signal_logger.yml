name: Signal Logger

on:
  schedule:
    # XAUUSD M15 strategy checks every 30 minutes during the 07:00-18:00 UTC window.
    - cron: "*/30 7-17 * * 1-5"
    # Dedicated NYOpen checks, including a 5-minute data-lag buffer after the range closes.
    - cron: "35 14 * * 1-5"
    - cron: "30 15 * * 1-5"
    # Daily outcome resolver after NY close.
    - cron: "0 21 * * 1-5"
  workflow_dispatch:           # allow manual run from GitHub UI

jobs:
  signal-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal logger
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python signal_logger.py

      - name: Resolve open trade outcomes
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python resolve_outcomes.py

      - name: Print metrics
        run: python metrics.py

      - name: Commit if new signals
        run: |
          git config user.name  "Signal Logger Bot"
          git config user.email "bot@github.com"
          git add paper_trades.csv
          git diff --cached --quiet || git commit -m "signals: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
